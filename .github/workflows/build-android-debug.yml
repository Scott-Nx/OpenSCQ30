name: build android debug

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "android/**"
      - ".github/workflows/build-android-debug.yml"

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Android build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          arch: arm64-v8a
          cache: true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleArm64-v8aDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openscq30-debug-arm64-v8a
          path: android/app/build/outputs/apk/arm64-v8a/debug/*.apk
